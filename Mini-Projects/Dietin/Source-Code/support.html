<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DietIn — Support</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair Display:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="nav">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">DietIn<span>.</span></a>
            <nav class="nav-links">
                <a href="index.html" class="nav-btn">Home</a>
                <a href="generator.html" class="nav-btn">Diet Generator</a>
                <a href="support.html" class="nav-btn active">Support</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="support-wrapper">
            <div class="support-card">
                <span class="section-eyebrow">Get in Touch</span>
                <h2>Need Help or Have Feedback?</h2>
                <p>Send our team a message and we will respond within one business day.</p>
                <form id="support-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" required placeholder="Your name">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" required placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea rows="4" required placeholder="Tell us how we can help..."></textarea>
                    </div>
                    <button type="submit" class="btn-support">Send Message</button>
                </form>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <div class="bottom-nav-inner">
            <a href="index.html" class="bottom-nav-btn">Home</a>
            <a href="generator.html" class="bottom-nav-btn">Generator</a>
            <a href="support.html" class="bottom-nav-btn active">Support</a>
        </div>
    </nav>

    <footer class="footer">
        <strong>DietIn</strong> &nbsp;&mdash;&nbsp; Intelligent Diet Planning &amp; Grocery Automation &nbsp;&mdash;&nbsp; 2026
    </footer>

    <script>
        document.getElementById('support-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Your message has been sent. Our team will respond within one business day.');
            e.target.reset();
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
