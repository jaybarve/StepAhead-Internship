<script>
    // Utility to auto-highlight active page links
    (function highlightActiveNav() {
        const path = window.location.pathname.split("/").pop() || "index.html";
        let page = "home";
        if (path.includes("generator") || path.includes("results")) page = "generator";
        if (path.includes("support")) page = "support";

        const topNav = document.getElementById("nav-" + page);
        const btmNav = document.getElementById("bnav-" + page);

        if (topNav) topNav.classList.add("active");
        if (btmNav) btmNav.classList.add("active");
    })();
</script>
